name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          grep -E '^e: |What went wrong|Execution failed|error:' -A4 build.log | head -120 || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PriceTrackerMY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (used by in-app updates)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PriceTrackerMY.apk
          gh release create "v${{ github.run_number }}" PriceTrackerMY.apk --title "PriceTracker MY 1.0.${{ github.run_number }}" --notes "Build ${{ github.run_number }}" --latest
